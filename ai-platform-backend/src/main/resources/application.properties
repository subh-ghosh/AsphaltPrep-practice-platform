# Server Port
server.port=${PORT:8080}

# Database Configuration (Will be injected by Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# API Keys (Environment Variables)
groq.api.key=${GROQ_API_KEY}
ai.model.practice=${AI_MODEL_PRACTICE:llama-3.1-8b-instant}
ai.model.study-plan=${AI_MODEL_STUDY_PLAN:llama-3.3-70b-versatile}
youtube.api.key=${YOUTUBE_API_KEY}
google.client-id=${GOOGLE_CLIENT_ID}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Frontend Connection (Allow your future cloud frontend)
app.frontend.url=${FRONTEND_URL}

# JWT Configuration
jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo[http.server.requests]=50ms,100ms,200ms,500ms,1s,2s,5s,10s,30s
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:}
management.otlp.metrics.export.headers.Authorization=${OTEL_EXPORTER_OTLP_AUTH:}
management.otlp.metrics.export.step=${OTLP_METRICS_STEP:300s}
management.health.circuitbreakers.enabled=true
management.endpoint.health.probes.enabled=true

# Generation request timeout
ai.request.timeout.practice-seconds=${AI_REQUEST_TIMEOUT_PRACTICE_SECONDS:8}
ai.request.timeout.study-plan-seconds=${AI_REQUEST_TIMEOUT_STUDY_PLAN_SECONDS:12}

# Resilience4j profile: practice generation calls (question/hint/answer/evaluate)
resilience4j.retry.instances.aiPractice.max-attempts=${RESILIENCE_AI_PRACTICE_RETRY_MAX_ATTEMPTS:1}
resilience4j.retry.instances.aiPractice.wait-duration=${RESILIENCE_AI_PRACTICE_RETRY_WAIT_DURATION:100ms}
resilience4j.retry.instances.aiPractice.enable-exponential-backoff=${RESILIENCE_AI_PRACTICE_RETRY_EXP_BACKOFF:true}
resilience4j.retry.instances.aiPractice.exponential-backoff-multiplier=${RESILIENCE_AI_PRACTICE_RETRY_BACKOFF_MULTIPLIER:2.0}
resilience4j.circuitbreaker.instances.aiPractice.sliding-window-type=${RESILIENCE_AI_PRACTICE_CB_WINDOW_TYPE:COUNT_BASED}
resilience4j.circuitbreaker.instances.aiPractice.sliding-window-size=${RESILIENCE_AI_PRACTICE_CB_WINDOW_SIZE:20}
resilience4j.circuitbreaker.instances.aiPractice.minimum-number-of-calls=${RESILIENCE_AI_PRACTICE_CB_MIN_CALLS:6}
resilience4j.circuitbreaker.instances.aiPractice.failure-rate-threshold=${RESILIENCE_AI_PRACTICE_CB_FAILURE_RATE:40}
resilience4j.circuitbreaker.instances.aiPractice.slow-call-rate-threshold=${RESILIENCE_AI_PRACTICE_CB_SLOW_RATE:50}
resilience4j.circuitbreaker.instances.aiPractice.slow-call-duration-threshold=${RESILIENCE_AI_PRACTICE_CB_SLOW_DURATION:3s}
resilience4j.circuitbreaker.instances.aiPractice.wait-duration-in-open-state=${RESILIENCE_AI_PRACTICE_CB_OPEN_WAIT:20s}
resilience4j.circuitbreaker.instances.aiPractice.permitted-number-of-calls-in-half-open-state=${RESILIENCE_AI_PRACTICE_CB_HALF_OPEN_CALLS:5}
resilience4j.circuitbreaker.instances.aiPractice.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.bulkhead.instances.aiPractice.max-concurrent-calls=${RESILIENCE_AI_PRACTICE_BULKHEAD_MAX_CALLS:8}
resilience4j.bulkhead.instances.aiPractice.max-wait-duration=${RESILIENCE_AI_PRACTICE_BULKHEAD_MAX_WAIT:0}

# Resilience4j profile: study-plan generation calls (heavier/stricter)
resilience4j.retry.instances.aiStudyPlan.max-attempts=${RESILIENCE_AI_STUDY_RETRY_MAX_ATTEMPTS:1}
resilience4j.retry.instances.aiStudyPlan.wait-duration=${RESILIENCE_AI_STUDY_RETRY_WAIT_DURATION:100ms}
resilience4j.retry.instances.aiStudyPlan.enable-exponential-backoff=${RESILIENCE_AI_STUDY_RETRY_EXP_BACKOFF:true}
resilience4j.retry.instances.aiStudyPlan.exponential-backoff-multiplier=${RESILIENCE_AI_STUDY_RETRY_BACKOFF_MULTIPLIER:2.0}
resilience4j.circuitbreaker.instances.aiStudyPlan.sliding-window-type=${RESILIENCE_AI_STUDY_CB_WINDOW_TYPE:COUNT_BASED}
resilience4j.circuitbreaker.instances.aiStudyPlan.sliding-window-size=${RESILIENCE_AI_STUDY_CB_WINDOW_SIZE:12}
resilience4j.circuitbreaker.instances.aiStudyPlan.minimum-number-of-calls=${RESILIENCE_AI_STUDY_CB_MIN_CALLS:4}
resilience4j.circuitbreaker.instances.aiStudyPlan.failure-rate-threshold=${RESILIENCE_AI_STUDY_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.aiStudyPlan.slow-call-rate-threshold=${RESILIENCE_AI_STUDY_CB_SLOW_RATE:70}
resilience4j.circuitbreaker.instances.aiStudyPlan.slow-call-duration-threshold=${RESILIENCE_AI_STUDY_CB_SLOW_DURATION:5s}
resilience4j.circuitbreaker.instances.aiStudyPlan.wait-duration-in-open-state=${RESILIENCE_AI_STUDY_CB_OPEN_WAIT:30s}
resilience4j.circuitbreaker.instances.aiStudyPlan.permitted-number-of-calls-in-half-open-state=${RESILIENCE_AI_STUDY_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.aiStudyPlan.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.bulkhead.instances.aiStudyPlan.max-concurrent-calls=${RESILIENCE_AI_STUDY_BULKHEAD_MAX_CALLS:2}
resilience4j.bulkhead.instances.aiStudyPlan.max-wait-duration=${RESILIENCE_AI_STUDY_BULKHEAD_MAX_WAIT:0}

# Bucket4j in-memory limits (entry-point protection for expensive endpoints)
rate.limit.ai.user.capacity=${RATE_LIMIT_AI_USER_CAPACITY:60}
rate.limit.ai.user.refill-minutes=${RATE_LIMIT_AI_USER_REFILL_MINUTES:1}
rate.limit.ai.ip.capacity=${RATE_LIMIT_AI_IP_CAPACITY:20}
rate.limit.ai.ip.refill-minutes=${RATE_LIMIT_AI_IP_REFILL_MINUTES:1}
rate.limit.study-plan.user.capacity=${RATE_LIMIT_STUDY_PLAN_USER_CAPACITY:10}
rate.limit.study-plan.user.refill-minutes=${RATE_LIMIT_STUDY_PLAN_USER_REFILL_MINUTES:60}
rate.limit.study-plan.ip.capacity=${RATE_LIMIT_STUDY_PLAN_IP_CAPACITY:3}
rate.limit.study-plan.ip.refill-minutes=${RATE_LIMIT_STUDY_PLAN_IP_REFILL_MINUTES:60}
jwt.refreshExpirationMs=86400000

# Cache / Redis
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO

# ===================================================================
# KAFKA EVENT-DRIVEN ARCHITECTURE (StreamBase Kafka)
# ===================================================================
# 1. Connection
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:broker.subartaghosh.co.in:9092}

# 2. Security (SASL_SSL / SCRAM-SHA-512)
spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
spring.kafka.properties.ssl.endpoint.identification.algorithm=${SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:}
spring.kafka.properties.ssl.engine.factory.class=${SPRING_KAFKA_SSL_ENGINE_FACTORY:com.practice.aiplatform.config.InsecureSslEngineFactory}
spring.kafka.ssl.engine-factory-class=${SPRING_KAFKA_SSL_ENGINE_FACTORY:com.practice.aiplatform.config.InsecureSslEngineFactory}

# 3. Admin Security (Inherits connection but useful for topic auto-creation)
spring.kafka.admin.fail-fast=false
spring.kafka.admin.fatal-if-broker-not-available=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.admin.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.admin.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
spring.kafka.admin.properties.ssl.endpoint.identification.algorithm=${SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM:}
spring.kafka.admin.properties.ssl.engine.factory.class=${SPRING_KAFKA_SSL_ENGINE_FACTORY:com.practice.aiplatform.config.InsecureSslEngineFactory}

# 4. Serializers & Engine
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.ssl.engine.factory.class=${SPRING_KAFKA_SSL_ENGINE_FACTORY:com.practice.aiplatform.config.InsecureSslEngineFactory}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.ssl.engine.factory.class=${SPRING_KAFKA_SSL_ENGINE_FACTORY:com.practice.aiplatform.config.InsecureSslEngineFactory}

# 5. Consumer Defaults
spring.kafka.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=practiceflow-gamification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
spring.kafka.listener.auth-exception-retry-interval=60s

